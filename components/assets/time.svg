<svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer ring gradient -->
  <defs>
    <linearGradient id="clockGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="handGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="centerGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffecd2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fcb69f;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Clock face background -->
  <circle cx="12" cy="12" r="10" fill="url(#centerGradient)" stroke="url(#clockGradient)" stroke-width="2"/>
  
  <!-- Hour markers -->
  <circle cx="12" cy="4" r="1" fill="#4f46e5"/>
  <circle cx="18" cy="12" r="1" fill="#06b6d4"/>
  <circle cx="12" cy="20" r="1" fill="#10b981"/>
  <circle cx="6" cy="12" r="1" fill="#f59e0b"/>
  
  <!-- Clock hands -->
  <path d="M12 6v6l4 2" stroke="url(#handGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Center dot -->
  <circle cx="12" cy="12" r="2" fill="#ef4444"/>
</svg>